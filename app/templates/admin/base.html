<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{% block title %}پنل مدیریت{% endblock %} · {{ cfg.LIBRARY_NAME }}</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.3/Vazirmatn-font-face.css">
<link rel="stylesheet" href="/static/site/tokens.css">
<link rel="stylesheet" href="/static/site/member.css">
<link rel="stylesheet" href="/static/site/admin.css">
<script>try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body class="admin">
{% if not hide_nav %}
<header class="admin-top">
  <div class="admin-bar">
    <a class="admin-brand" href="/admin"><img src="/static/site/logo-trimmed.png" alt="کاوی کنج" height="40"><b>پنل کتابدار</b></a>
    <button class="nav-toggle" type="button" id="aNav" aria-expanded="false" aria-controls="aMenu" aria-label="منو">☰</button>
    <nav class="admin-nav" id="aMenu" aria-label="منوی پنل">
      {% set p = request.url.path %}
      <a href="/admin" {% if p == '/admin' %}aria-current="page"{% endif %}>داشبورد</a>
      <a href="/admin/members" {% if p.startswith('/admin/members') %}aria-current="page"{% endif %}>اعضا</a>
      <a href="/admin/loans" {% if p.startswith('/admin/loans') %}aria-current="page"{% endif %}>امانت‌ها</a>
      <a href="/admin/books" {% if p.startswith('/admin/books') %}aria-current="page"{% endif %}>کتاب‌ها</a>
      <a href="/admin/club" {% if p.startswith('/admin/club') %}aria-current="page"{% endif %}>کلوپ و پیشنهادها</a>
      <a href="/admin/payments" {% if p.startswith('/admin/payments') %}aria-current="page"{% endif %}>حسابداری</a>
      <span class="admin-nav-end"><a href="/" target="_blank" rel="noopener">دیدن سایت</a><a href="/admin/logout">خروج</a></span>
    </nav>
  </div>
</header>
{% endif %}
<main class="admin-wrap">
{% if flash %}<div class="flash {{ 'ok' if flash.ok else 'bad' }}" role="{{ 'status' if flash.ok else 'alert' }}">{{ '✓ ' if flash.ok else '⚠ ' }}{{ flash.msg }}</div>{% endif %}
{% block body %}{% endblock %}
</main>
<script>
(function(){var b=document.getElementById('aNav'),n=document.getElementById('aMenu');if(!b)return;
b.addEventListener('click',function(){var o=n.classList.toggle('is-open');b.setAttribute('aria-expanded',o)});})();
document.addEventListener('submit',function(e){var f=e.target,m=f.dataset&&f.dataset.confirm;if(m&&!confirm(m))e.preventDefault();});
</script>
{% block scripts %}{% endblock %}
</body>
</html>
