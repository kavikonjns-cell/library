{% extends "admin/base.html" %}{% set hide_nav = True %}
{% block title %}ورود{% endblock %}
{% block body %}
<section class="box login-box">
  <img src="/static/site/logo-trimmed.png" alt="کاوی کنج">
  <h2>پنل مدیریت {{ cfg.LIBRARY_NAME }}</h2>
  {% if not cfg.ADMIN_PASSWORD %}<div class="notice">رمز پنل تنظیم نشده است. ADMIN_PASSWORD را در فایل ‎.env بنویسید.</div>{% endif %}
  <form method="post" action="/admin/login">
    <div class="field"><label class="sr-only" for="ap">رمز پنل</label><input type="password" id="ap" name="password" placeholder="رمز پنل" autofocus required></div>
    <button class="btn wide">ورود</button>
  </form>
</section>
{% endblock %}
