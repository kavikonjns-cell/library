# Render's free plan puts the site to sleep after 15 idle minutes; the first visit then waits ~1 minute
# on a black "loading" page. A light request every 10 minutes keeps it awake.
name: keep-awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://kavikonj.onrender.com/health
